anytraverse:
  ros__parameters:
    hydra_config_file: config/pipelines/paper.yaml
    scene_sim_thresh: 0.8
    roi_unc_thresh: 0.5
    roi_x_bounds:
      - 0.33
      - 0.67
    roi_y_bounds:
      - 0.67
      - 0.95
    topic:
      # TODO: Specify RGB image topic here
      # Consider passing in recitified (undistorted) images
      image: /warthog/rgb/image_rect
      # You may leave the following unchanged
      trav_map: trav_map
      unc_map: unc_map
      state: state

vel_gating:
  ros__parameters:
    enable: true
    state_topic: state
    cmd_vel_topic:
      # This is the velocity command output topic from Nav2
      in: /cmd_vel
      # TODO: Update Warthog velocity topic
      out: /warthog/cmd_vel
