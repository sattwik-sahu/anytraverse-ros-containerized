bt_navigator:
  ros__parameters:
    use_sim_time: False
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    global_frame: odom
    robot_base_frame: base_link
    # TODO: Update odom topic for Warthog
    odom_topic: /odom
    default_server_timeout: 1000   # ms; 20ms default is too short for clear_costmap under load
    default_nav_to_pose_bt_xml: "/opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/navigate_w_replanning_time.xml"
    default_nav_through_poses_bt_xml: "/opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml"

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 30.0
    min_x_velocity_threshold: 0.05
    min_theta_velocity_threshold: 0.01
    odom_topic: /odom
    progress_checker_plugin: "progress_checker"
    goal_checker_plugin: "goal_checker"
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1     # Robot must move at least 10 cm in 2 min
      movement_time_allowance: 120.0    # Allows hooman 2 mins to update traversability preferences
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25     # Be within 0.25 m of goal point for success
      yaw_goal_tolerance: 3.15    # Final heading is never checked (angular error is always <= pi)
      stateful: True
    FollowPath:
      # TODO: Update the parameters for Warthog
      # Currently set to example from Nav2 docs
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      vx_std: 0.2
      vy_std: 0.2
      wz_std: 0.4
      vx_max: 0.5
      vx_min: -0.35
      vy_max: 0.5
      wz_max: 1.9
      ax_max: 3.0
      ax_min: -3.0
      ay_min: -3.0
      ay_max: 3.0
      az_max: 3.5
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: false
      # reset_period: 1.0 # (only in Humble)
      regenerate_noises: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      AckermannConstraints:
        min_turning_r: 0.2
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      # ObstaclesCritic:
      #   enabled: true
      #   cost_power: 1
      #   repulsion_weight: 1.5
      #   critical_weight: 20.0
      #   consider_footprint: false
      #   collision_cost: 10000.0
      #   collision_margin_distance: 0.1
      #   near_goal_distance: 0.5
      #   inflation_radius: 0.55 # (only in Humble)
      #   cost_scaling_factor: 10.0 # (only in Humble)
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0
      # VelocityDeadbandCritic:
      #   enabled: true
      #   cost_power: 1
      #   cost_weight: 35.0
      #   deadband_velocities: [0.05, 0.05, 0.05]
      # TwirlingCritic:
      #   enabled: true
      #   twirling_cost_power: 1
      #   twirling_cost_weight: 10.0

planner_server:
  ros__parameters:
    use_sim_time: False
    # Just a warning threshold (max time createPlan() may take before Nav2 logs a
    # warning) -- it does NOT control replan rate. Actual replanning cadence is the
    # RateController in behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml
    # (raised from Nav2's stock 1.0 -> 5.0 Hz there); kept matching it here.
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_smac_planner::SmacPlannerHybrid"
      downsample_costmap: false           # whether or not to downsample the map
      downsampling_factor: 1              # multiplier for the resolution of the costmap layer (e.g. 2 on a 5cm costmap would be 10cm)
      tolerance: 0.25                     # dist-to-goal heuristic cost (distance) for valid tolerance endpoints if exact goal cannot be found.
      allow_unknown: true                 # allow traveling in unknown space
      max_iterations: 1000000             # maximum total iterations to search for before failing (in case unreachable), set to -1 to disable
      max_on_approach_iterations: 1000    # Maximum number of iterations after within tolerances to continue to try to find exact solution
      max_planning_time: 5.0              # max time in s for planner to plan, smooth
      motion_model_for_search: "DUBIN"    # Hybrid-A* Dubin, Redds-Shepp
      angle_quantization_bins: 72         # Number of angle bins for search
      analytic_expansion_ratio: 3.5       # The ratio to attempt analytic expansions during search for final approach.
      analytic_expansion_max_length: 3.0  # For Hybrid/Lattice nodes: The maximum length of the analytic expansion to be considered valid to prevent unsafe shortcutting
      analytic_expansion_max_cost: 200.0  # The maximum single cost for any part of an analytic expansion to contain and be valid, except when necessary on approach to goal
      analytic_expansion_max_cost_override: false  #  Whether or not to override the maximum cost setting if within critical distance to goal (ie probably required)
      minimum_turning_radius: 1.0        # minimum turning radius in m of path / vehicle
      reverse_penalty: 2.0                # Penalty to apply if motion is reversing, must be => 1
      change_penalty: 0.0                 # Penalty to apply if motion is changing directions (L to R), must be >= 0
      non_straight_penalty: 1.2           # Penalty to apply if motion is non-straight, must be => 1
      cost_penalty: 2.0                   # Penalty to apply to higher cost areas when adding into the obstacle map dynamic programming distance expansion heuristic. This drives the robot more towards the center of passages. A value between 1.3 - 3.5 is reasonable.
      retrospective_penalty: 0.015
      lookup_table_size: 20.0             # Size of the dubin/reeds-sheep distance window to cache, in meters.
      cache_obstacle_heuristic: false     # Cache the obstacle map dynamic programming distance expansion heuristic between subsequent replannings of the same goal location. Dramatically speeds up replanning performance (40x) if costmap is largely static.
      debug_visualizations: false         # For Hybrid nodes: Whether to publish expansions on the /expansions topic as an array of poses (the orientation has no meaning) and the path's footprints on the /planned_footprints topic. WARNING: heavy to compute and to display, for debug only as it degrades the performance.
      use_quadratic_cost_penalty: False
      downsample_obstacle_heuristic: True
      allow_primitive_interpolation: False
      coarse_search_resolution: 4         # Number of bins to skip when doing a coarse search for the path. Only used for all_direction goal heading mode.
      goal_heading_mode: "DEFAULT"        # DEFAULT, BIDIRECTIONAL, ALL_DIRECTION
      smooth_path: True                   # If true, does a simple and quick smoothing post-processing to the path

      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 2

behavior_server:
  ros__parameters:
    use_sim_time: False
    global_frame: odom
    robot_base_frame: base_link
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    behavior_plugins: ["backup"]
    # 0.0 disables BackUp's costmap collision check (DriveOnHeading::isCollisionFree
    # loops cycle_frequency * simulate_ahead_time times, starting AT the current pose).
    # With the default 2.0, a vehicle whose footprint is already on lethal cells can
    # never back out ("Collision Ahead - Exiting DriveOnHeading").
    # ponytail: blind reverse, nothing stops it for an obstacle behind; restore 2.0
    # once segmentation stops marking the ground under the vehicle lethal.
    simulate_ahead_time: 0.0
    backup:
      plugin: "nav2_behaviors::BackUp"

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    # Nav2's own stock defaults (nav2_bringup), not tuned for this vehicle.
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: false
      waypoint_pause_duration: 200

# collision_monitor: DO NOT DELETE THIS BLOCK. The node is launched by
# navigation_launch.py and aborts ALL of bringup if these keys are missing
# (untyped empty lists crash identically). It is intentionally inert: a
# disabled source plus a far-away zone, so it configures clean and never
# triggers. To make it a real guard, wire observation_sources to /lidar/points.
collision_monitor:
  ros__parameters:
    enabled: false
    observation_sources: ["idle_scan"]
    idle_scan:
      type: "pointcloud"
      topic: "/idle"
      enabled: False
    polygons: ["idle_poly"]
    idle_poly:
      type: "polygon"
      action_type: "stop"
      points: "[[100.0, 100.0], [100.0, 100.0], [100.0, 100.0], [100.0, 100.0]]"
      min_points: 1

velocity_smoother:
  ros__parameters:
    # TODO: Update this block for Warthog
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP" # odom feedback on (/odom @10 Hz); was OPEN_LOOP
    max_velocity: [1.0, 0.0, 1.57]
    min_velocity: [-0.5, 0.0, -1.57]
    max_accel: [2.0, 0.0, 3.00]
    max_decel: [-2.0, 0.0, -3.00]
    deadband_velocity: [0.05, 0.0, 0.01]
    velocity_timeout: 1.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: False
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: false
      # TODO: Update with actual costmap size
      width: 250
      height: 250
      resolution: 0.1    # 0.1 m square cells in grid
      # These two must always be half of the width and height respectively
      origin_x: -125.0
      origin_y: -125.0
      # TODO: Update Warthog base footprint
      footprint: "[[0.55, 0.4], [0.55, -0.4], [-0.55, -0.4], [-0.55, 0.4]]"
      # Extra clearance for SmacPlannerHybrid: its search collision-checks this padded
      # footprint (the smoother relies on inflation instead). Global costmap only, so
      # controller/BackUp (local costmap) still use the true footprint.
      # ponytail: 1.0 m margin on all sides, lower it if narrow roads stop being plannable.
      # footprint_padding: 2.0
      # False: unexplored cells default straight to free space instead of NO_INFORMATION,
      # so they're fully traversable, not just planner-allowed-but-tolled. (Previously true,
      # which -- combined with SmacPlannerHybrid's cost_penalty tolling any non-free cell,
      # unknown included -- made most of this mostly-unexplored 250x250m map look expensive.)
      track_unknown_space: false
      transform_tolerance: 0.3
      always_send_full_costmap: true

      plugins: ["segmentation_layer", "inflation_layer"]

      # Based on semantic_segmentation_layer/config/segmentation_layer_local_costmap.yaml
      # (that package's own launch file is a standalone test bringup; this is the "fold it
      # into your stack" step its README/comments call for). Do not duplicate its standalone
      # node -- keep it running for standalone testing/visualization, but Nav2's costmaps
      # load the same plugin class directly.
      #
      # tile_map_decay_time is intentionally NOT copied verbatim from that file: it's tuned
      # there for a *local* rolling costmap (fast expiry so stale nearby marks don't linger).
      # This is the persistent GLOBAL costmap -- a short decay here means any cell outside
      # the sensor's current instantaneous view reverts to free/unknown a few seconds after
      # being observed, which looks like "the costmap keeps resetting". Use a decay long
      # enough to cover a full run instead.
      segmentation_layer:
        plugin: "semantic_segmentation_layer::SemanticSegmentationLayer"
        enabled: true
        combination_method: 1
        observation_sources: lidar_camera
        lidar_camera:
          project_pointcloud: true
          # TODO: Update topic name from Ouster on Warthog
          pointcloud_topic: "/warthog/lidar/points"
          segmentation_topic: "/trav_map"
          # TODO: Update with camera info topic on Warthog
          camera_info_topic: "/warthog/rgb/camera_info"
          confidence_topic: ""
          labels_topic: ""
          camera_optical_frame: ""
          approximate_sync: true
          approximate_sync_tolerance: 0.05
          min_obstacle_distance: 0.3
          max_obstacle_distance: 20.0
          observation_persistence: 0.0
          expected_update_rate: 20.0
          tile_map_decay_time: 3.0   # persist observations for the whole run (was 3.0)
          visualize_tile_map: false
          # direct_cost: true
          # direct_cost_scale: 254.0
          # direct_cost_offset: 0.0
          # direct_cost_ignore_min: -1
          # direct_cost_ignore_max: -1

          direct_cost: false
          use_cost_selection: true
          class_types: ["obstacle", "traversable"] #, "unknown"]
          obstacle:
            classes: ["obstacle"]
            class_ids: [1]
            value_min: 0
            value_max: 140 #130
            base_cost: 254
            max_cost: 254
            min_points_per_tile: 4
            dominant_priority: false
          traversable:
            classes: ["traversable"]
            class_ids: [2]
            value_min: 141 #146
            value_max: 255
            base_cost: 0
            max_cost: 0
            min_points_per_tile: 1
            dominant_priority: true

          # NOTE: ZetaNav stuff for Karthik
          # zeta_seg publishes 163 for pixels it isn't confident about
          # (segmentation_node.UNKNOWN_MASK_VALUE, in the band left free between the two
          # ranges above). Treated as traversable: cost 0, and no dominant_priority, so a
          # later obstacle/traversable observation of the same tile still wins.
          # unknown:
          #   classes: ["unknown"]
          #   class_ids: [3]
          #   value_min: 157
          #   value_max: 169
          #   base_cost: 0
          #   max_cost: 0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.6   # TODO: Must be a little more than 0.5 * width of Warthog
        cost_scaling_factor: 3.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: False
      update_frequency: 5.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 50
      height: 50
      resolution: 0.1
      origin_x: -25.0
      origin_y: -25.0
      # TODO: Update Warthog base footprint
      footprint: "[[0.55, 0.4], [0.55, -0.4], [-0.55, -0.4], [-0.55, 0.4]]"
      track_unknown_space: false
      transform_tolerance: 0.3
      always_send_full_costmap: true

      plugins: ["segmentation_layer", "inflation_layer"]

      segmentation_layer:
        plugin: "semantic_segmentation_layer::SemanticSegmentationLayer"
        enabled: true
        combination_method: 1
        observation_sources: lidar_camera
        lidar_camera:
          project_pointcloud: true
          # TODO: Update topic name from Ouster on Warthog
          pointcloud_topic: "/warthog/ouster/points"
          segmentation_topic: "/trav_map"
          # TODO: Update with camera info topic on Warthog
          camera_info_topic: "/warthog/rgb/camera_info"
          confidence_topic: ""
          labels_topic: ""
          camera_optical_frame: ""
          approximate_sync: true
          approximate_sync_tolerance: 0.05
          min_obstacle_distance: 0.3
          max_obstacle_distance: 20.0
          observation_persistence: 0.0
          expected_update_rate: 0.0
          tile_map_decay_time: 3.0     # fast expiry for the rolling local costmap -- was
                                       # copy-pasted from global_costmap's 3600.0, which left
                                       # stale/transient obstacle tiles undead: reset() only
                                       # clears the Costmap2D grid (SemanticSegmentationLayer::
                                       # reset(), semantic_segmentation_layer.cpp), not this
                                       # buffer, so a bad tile got redrawn on every update
                                       # regardless of clear_entirely_local_costmap recovery.
          visualize_tile_map: false
          # direct_cost: true
          # direct_cost_scale: 254.0
          # direct_cost_offset: 0.0
          # direct_cost_ignore_min: -1
          # direct_cost_ignore_max: -1

          direct_cost: false
          use_cost_selection: true
          class_types: ["obstacle","traversable"] #, "unknown"]
          obstacle:
            classes: ["obstacle"]
            class_ids: [1]
            value_min: 0
            value_max: 140
            base_cost: 254
            max_cost: 254
            dominant_priority: false
          traversable:
            classes: ["traversable"]
            class_ids: [2]
            value_min: 141
            value_max: 255
            base_cost: 0
            max_cost: 0
            dominant_priority: true
          # unknown:                       # see global_costmap for why
          #   classes: ["unknown"]
          #   class_ids: [3]
          #   value_min: 157
          #   value_max: 169
          #   base_cost: 0
          #   max_cost: 0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.6   # TODO: Must be 0.5 * width of Warthog
        cost_scaling_factor: 3.0

# NOTE: Ignore below, never used really. But breaks config when removed.
docking_server:
  ros__parameters:
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5

    # Types of docks
    dock_plugins: ["simple_charging_dock"]
    simple_charging_dock:
      plugin: "opennav_docking::SimpleChargingDock"
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false # true
      use_stall_detection: false # true

      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1

    # Dock instances
    # The following example illustrates configuring dock instances.
    # docks: ['home_dock']  # Input your docks here
    # home_dock:
    #   type: 'simple_charging_dock'
    #   frame: map
    #   pose: [0.0, 0.0, 0.0]

    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15
