amcl:
  ros__parameters:
    enabled: False # Disabled because we are using VIO/Odom only

bt_navigator:
  ros__parameters:
    global_frame: odom
    robot_base_frame: base_link
    use_sim_time: False
    default_bt_xml_filename: "navigate_to_pose_w_replanning_and_recovery.xml"

controller_server:
  ros__parameters:
    controller_frequency: 30.0
    # FIELD: names the active controller plugin. Without this key Nav2 follows nothing.
    controller_plugins: ["FollowPath"]
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.033   # must equal 1/controller_frequency (was 0.05: breaks prediction math)
      batch_size: 2000  # FIELD: first perf knob on Orin CPU; drop to 1000 on overruns
      vx_std: 1.0
      vy_std: 0.6
      wz_std: 1.57
      vx_max: 1.0   # FIELD: keep near base max_wheel_speed (0.913); smoother caps separately
      vx_min: -0.4
      vy_max: 0.5
      wz_max: 3.14
      ax_max: 7.0
      ax_min: -7.0
      ay_min: -3.0
      ay_max: 3.0
      az_max: 6.28
      iteration_count: 1
      temperature: 1.2
      gamma: 0.15
      motion_model: "ackermann"   # base is Ackermann-clamped: DiffDrive samples spins it refuses
      ackermann:
        plugin: "mppi::AckermannMotionModel"
        # FIELD: must equal base_driver min_turning_radius (1.0)
        min_turning_r: 1.0
      visualize: false
      regenerate_noises: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      critics:
        - ConstraintCritic
        - CostCritic
        - GoalCritic
        - GoalAngleCritic
        - PathAlignCritic
        - PathFollowCritic
        - PathAngleCritic
        - PreferForwardCritic
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: false
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      # ObstaclesCritic:
      #   enabled: true
      #   cost_power: 1
      #   repulsion_weight: 1.5
      #   critical_weight: 20.0
      #   consider_footprint: false
      #   collision_cost: 10000.0
      #   collision_margin_distance: 0.1
      #   near_goal_distance: 0.5
      #   inflation_radius: 0.55 # (only in Humble)
      #   cost_scaling_factor: 10.0 # (only in Humble)
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0
      VelocityDeadbandCritic:
        enabled: true
        cost_power: 1
        cost_weight: 35.0
        # FIELD: was [0.5, 0.5, 0.07]: zeroes everything under half top speed,
        # killing docking-precision creep an Ackermann base needs most. Raise
        # only with measured stall-zone justification from bench tests.
        deadband_velocities: [0.05, 0.0, 0.05]
      # TwirlingCritic:
      #   enabled: true
      #   twirling_cost_power: 1
      #   twirling_cost_weight: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 15.0
      publish_frequency: 5.0

      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true

      width: 8
      height: 8
      resolution: 0.05

      always_send_full_costmap: true

      footprint: "[[0.60, 0.55], [0.60, -0.55], [-0.60, -0.55], [-0.60, 0.55]]"

      plugins: ["voxel_layer", "segmentation_layer", "inflation_layer"]

      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.2
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /lidar/points
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "PointCloud2"

      segmentation_layer:
        plugin: "semantic_segmentation_layer::SemanticSegmentationLayer"
        enabled: true
        combination_method: 1
        observation_sources: lidar_camera
        lidar_camera:
          project_pointcloud: true
          pointcloud_topic: "/lidar/points"
          segmentation_topic: "/trav_map"
          camera_info_topic: "/flir_camera/camera_info"
          confidence_topic: ""
          labels_topic: ""
          camera_optical_frame: ""
          approximate_sync: true
          approximate_sync_tolerance: 0.05
          min_obstacle_distance: 0.3
          max_obstacle_distance: 20.0
          observation_persistence: 0.0
          expected_update_rate: 10.0   # ouster 1024x10 mode; was 20.0 (spurious timeouts)
          # Short decay until reset() also clears the temporal buffer (see
          # SemanticSegmentationLayer::reset(): only the Costmap2D grid is
          # cleared today, so 3600 here lets one bad observation haunt the
          # rolling window for an hour).
          tile_map_decay_time: 3.0
          visualize_tile_map: false
          # Continuous mono8 map (0 = blocked, 255 = free):
          #   cost = scale*(1 - v/255) + offset  (inversion built in)
          direct_cost: true
          direct_cost_scale: 254.0
          direct_cost_offset: 0.0
          # zeta_seg "unknown" band (value 163) is dropped, not costed
          direct_cost_ignore_min: 157
          direct_cost_ignore_max: 169

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.25
        cost_scaling_factor: 4.0

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: odom
      robot_base_frame: base_link
      resolution: 0.1
      footprint: "[[0.60, 0.55], [0.60, -0.55], [-0.60, -0.55], [-0.60, 0.55]]"
      plugins: ["voxel_layer", "segmentation_layer", "inflation_layer"]
      rolling_window: true
      width: 100
      height: 100
      # plugins: ["obstacle_layer", "inflation_layer"]

      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.2
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /lidar/points
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "PointCloud2"

      segmentation_layer:
        plugin: "semantic_segmentation_layer::SemanticSegmentationLayer"
        enabled: true
        combination_method: 1
        observation_sources: lidar_camera
        lidar_camera:
          project_pointcloud: true
          pointcloud_topic: "/lidar/points"
          segmentation_topic: "/trav_map"
          camera_info_topic: "/flir_camera/camera_info"
          confidence_topic: ""
          labels_topic: ""
          camera_optical_frame: ""
          approximate_sync: true
          approximate_sync_tolerance: 0.05
          min_obstacle_distance: 0.3
          max_obstacle_distance: 20.0
          observation_persistence: 0.0
          expected_update_rate: 0.0
          tile_map_decay_time: 3.0    # fast expiry for the rolling local costmap -- was
                                       # copy-pasted from global_costmap's 3600.0, which left
                                       # stale/transient obstacle tiles undead: reset() only
                                       # clears the Costmap2D grid (SemanticSegmentationLayer::
                                       # reset(), semantic_segmentation_layer.cpp), not this
                                       # buffer, so a bad tile got redrawn on every update
                                       # regardless of clear_entirely_local_costmap recovery.
          visualize_tile_map: false
          # Continuous mono8 map (0 = blocked, 255 = free):
          #   cost = scale*(1 - v/255) + offset  (inversion built in)
          direct_cost: true
          direct_cost_scale: 254.0
          direct_cost_offset: 0.0
          # zeta_seg "unknown" band (value 163) is dropped, not costed
          direct_cost_ignore_min: 157
          direct_cost_ignore_max: 169

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.35

planner_server:
  ros__parameters:
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_smac_planner::SmacPlannerHybrid" # Using Hybrid-A* planner
      downsample_costmap: false
      downsampling_factor: 1
      tolerance: 0.25 # FIELD: goal acceptance radius; 25 cm is good enough
      allow_unknown: true # Can travel in unknown space, since unknown environment
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0 # Planning and smoothing should complete in 5.0 sec
      motion_model_for_search: "REEDS_SHEPP" # Motion model for legged robot
      angle_quantization_bins: 64 # Docs say 72 but meh whatever
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      analytic_expansion_max_cost: 200.0
      analytic_expansion_max_cost_override: false
      minimum_turning_radius: 1.0 # FIELD: must equal base_driver min_turning_radius (1.0); smaller draws paths the clamped base cannot follow
      reverse_penalty: 2.0 # Penalty to apply if motion reversing
      change_penalty: 0.0
      non_straight_penalty: 1.0 # No wonky-ass paths
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      lookup_table_size: 20.0 # Size of the dubin/reeds-sheep distance window to cache, in meters.
      cache_obstacle_heuristic: false # Cache the obstacle map dynamic programming distance expansion heuristic between subsequent replannings of the same goal location. Dramatically speeds up replanning performance (40x) if costmap is largely static.
      debug_visualizations: false # For Hybrid nodes: Whether to publish expansions on the /expansions topic as an array of poses (the orientation has no meaning) and the path's footprints on the /planned_footprints topic. WARNING: heavy to compute and to display, for debug only as it degrades the performance.
      use_quadratic_cost_penalty: False
      downsample_obstacle_heuristic: True
      allow_primitive_interpolation: False
      coarse_search_resolution: 4 # Number of bins to skip when doing a coarse search for the path. Only used for all_direction goal heading mode.
      goal_heading_mode: "ALL_DIRECTION" # DEFAULT, BIDIRECTIONAL, ALL_DIRECTION* (Just get to the goal, whatever orientation)
      smooth_path: True # If true, does a simple and quick smoothing post-processing to the path

      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 2

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

# collision_monitor removed: it watched /obstacle_points, which nothing
# publishes (no such remap exists). Re-add wired to /lidar/points if a
# dedicated safety stop is wanted later.
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "CLOSED_LOOP" # Use OPEN_LOOP if you don't have good wheel encoder feedback
    max_velocity: [2.0, 0.0, 1.57] # x, y, theta
    min_velocity: [-0.5, 0.0, -1.57]
    max_accel: [5.0, 5.0, 6.28]
    max_decel: [-5.0, -5.0, -6.28]
    odom_topic: "odom"
    robot_base_frame: "base_link"

# Default settings, we never really dock the robot
docking_server:
  ros__parameters:
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5

    # Types of docks
    dock_plugins: ["simple_charging_dock"]
    simple_charging_dock:
      plugin: "opennav_docking::SimpleChargingDock"
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false # true
      use_stall_detection: false # true

      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1

    # Dock instances
    # The following example illustrates configuring dock instances.
    # docks: ['home_dock']  # Input your docks here
    # home_dock:
    #   type: 'simple_charging_dock'
    #   frame: map
    #   pose: [0.0, 0.0, 0.0]

    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15
